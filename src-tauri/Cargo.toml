[package]
name = "offroute"
version = "0.1.0"
description = "Offroute — Your desktop companion"
authors = []
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# tauri-plugin-stronghold = "2" # Di-disable sementara untuk build Android di Windows
# argon2 = "0.5" # Di-disable sementara
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-os = "2.3.2"
tauri-plugin-geolocation = "2"

tauri-plugin-store = "2.4.3"
btleplug = "0.11"
tokio = { version = "1", features = ["sync", "process", "time"] }
uuid = "1"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(not(target_os = "android"))'.dependencies]
starship-battery = "0.11.1"
