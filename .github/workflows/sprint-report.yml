# Weekly sprint report.
#
# The proposal commits the team to Scrum with weekly sprints, a sprint review
# and a retrospective. This posts an issue every Monday with what actually
# happened in the last 7 days, so sprint review runs on data instead of on
# whoever remembers the most.
name: Sprint Report

on:
  schedule:
    # Monday 01:00 UTC = 08:00 WIB, before the team's week starts.
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    name: Post weekly sprint report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const sinceISO = since.toISOString();

            // --- Commits, grouped by author -----------------------------------
            const commits = await github.paginate(github.rest.repos.listCommits, {
              owner, repo, since: sinceISO, per_page: 100,
            });
            const byAuthor = {};
            for (const c of commits) {
              const name = c.author?.login ?? c.commit.author?.name ?? 'unknown';
              byAuthor[name] = (byAuthor[name] ?? 0) + 1;
            }
            const authorRows = Object.entries(byAuthor)
              .sort((a, b) => b[1] - a[1])
              .map(([name, n]) => `| ${name} | ${n} |`)
              .join('\n') || '| _(no commits)_ | 0 |';

            // --- Pull requests -------------------------------------------------
            const allPrs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'all', sort: 'updated', direction: 'desc', per_page: 100,
            });
            const merged = allPrs.filter(
              (p) => p.merged_at && new Date(p.merged_at) >= since,
            );
            const open = allPrs.filter((p) => p.state === 'open');

            const mergedList = merged.length
              ? merged.map((p) => `- #${p.number} ${p.title} — @${p.user.login}`).join('\n')
              : '_No PRs were merged this week._';

            const openList = open.length
              ? open.map((p) => {
                  const age = Math.floor(
                    (Date.now() - new Date(p.created_at)) / 86400000,
                  );
                  const stale = age >= 7 ? ' **(stale — please review)**' : '';
                  return `- #${p.number} ${p.title} — @${p.user.login}, ${age} days old${stale}`;
                }).join('\n')
              : '_No open PRs._';

            // --- Open issues ---------------------------------------------------
            const issues = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            })).filter((i) => !i.pull_request);

            const issueList = issues.length
              ? issues.slice(0, 15).map((i) => `- #${i.number} ${i.title}`).join('\n')
              : '_No open issues._';

            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `## Sprint report — week ending ${today}`,
              '',
              'Generated automatically as input for **sprint review** and **retrospective**.',
              '',
              `### Commits (${commits.length} total)`,
              '',
              '| Contributor | Commits |',
              '| --- | --- |',
              authorRows,
              '',
              `### Merged PRs (${merged.length})`,
              '',
              mergedList,
              '',
              `### Still-open PRs (${open.length})`,
              '',
              openList,
              '',
              `### Open issues (${issues.length})`,
              '',
              issueList,
              '',
              '---',
              '',
              '### Retrospective discussion points',
              '',
              '- [ ] What shipped this week versus what was planned?',
              '- [ ] Any PR left hanging more than 7 days? Why?',
              '- [ ] Any blocker that needs the whole team?',
              '- [ ] What is the target for next sprint?',
              '',
              '> See `TODO.md` for the current status of which features are real,',
              '> which are still simulated, and which are deferred.',
            ].join('\n');

            await github.rest.issues.create({
              owner, repo,
              title: `Sprint report — ${today}`,
              body,
              labels: ['sprint-report'],
            });
