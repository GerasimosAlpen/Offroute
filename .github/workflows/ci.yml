# Fast feedback on every push and PR.
#
# This is the gate that should stay green and stay quick (~2-4 min). It never
# builds a native binary — that is build.yml's job, and it is deliberately
# kept separate so a typo in a README does not cost 40 minutes of runner time.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per branch. A new push cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only ever reads the repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Works out what actually changed, so heavy jobs can skip themselves on a
  # docs-only PR. Every downstream job reads these outputs.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'deno.json'
              - 'deno.lock'
              - 'package.json'
            rust:
              - 'src-tauri/**'
            server:
              - '_server/**'

  # ---------------------------------------------------------------------------
  # Frontend: typecheck + lint + format + tests.
  #
  # Note this repo had NO lint or format config for its 157-file frontend until
  # now, so `deno lint` runs in report-only mode (continue-on-error) rather than
  # failing every PR on day one. Flip it to blocking once the backlog is clear.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (typecheck, lint, test)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install dependencies
        run: deno install

      # The real gate. tsconfig has strict + noUnusedLocals + noUnusedParameters
      # turned on, and this repo has shipped a broken tsc before, so this is the
      # single most valuable check in the whole pipeline.
      - name: Typecheck
        run: deno task typecheck

      - name: Format check
        run: deno task fmt:check
        continue-on-error: true

      - name: Lint
        run: deno task lint
        continue-on-error: true

      - name: Test
        run: deno task test

      # Proves the production bundle actually builds — this is exactly what
      # tauri.conf.json's beforeBuildCommand runs, so a failure here means every
      # native build in build.yml would fail too, just 30 minutes later.
      - name: Build frontend bundle
        run: deno task build

  # ---------------------------------------------------------------------------
  # Rust / Tauri: format, clippy, and a type-level check.
  # `cargo check` rather than a full build — build.yml does the real thing.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (fmt, clippy, check)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ci-lint

      # Tauri's build script needs ../dist to exist to generate its context.
      - name: Stub frontend dist
        run: mkdir -p dist && echo '<!doctype html><title>ci</title>' > dist/index.html

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all --check
        continue-on-error: true

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Check
        working-directory: src-tauri
        run: cargo check --all-targets

  # ---------------------------------------------------------------------------
  # NestJS backend. Previously CI ignored _server/ entirely, despite it being
  # 11 modules, 34 REST endpoints and a 16-event Socket.IO gateway.
  # ---------------------------------------------------------------------------
  server:
    name: Backend (_server)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Prisma's client is generated, not committed — nothing compiles without it.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      # Unit tests only. The e2e suite imports the full AppModule and needs a
      # live Postgres, so it is not run here.
      - name: Test
        run: npm run test

  # ---------------------------------------------------------------------------
  # Single required status check. Branch protection can point at just this job
  # instead of tracking every matrix leg by name.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI OK
    if: always()
    needs: [frontend, rust, server]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not pass."
              exit 1
            fi
          done
          echo "All required CI jobs passed (skipped jobs are OK)."
