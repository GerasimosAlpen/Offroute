# Advisory commit-message check.
#
# NON-BLOCKING on purpose. The history contains commits called "cihuy", "ahay",
# "uhuy", "jo", "ja" and "jangan" — useful when you are moving fast, useless
# when you are trying to work out which change broke the Android build three
# weeks later. This nudges toward Conventional Commits without ever standing
# between the team and a merge.
name: Commit Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Check commit messages (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check messages against Conventional Commits
        run: |
          # Merge commits are generated by GitHub and never match the format.
          RANGE="origin/${{ github.base_ref }}..HEAD"
          SUBJECTS=$(git log --no-merges --format='%s' "$RANGE")

          if [ -z "$SUBJECTS" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/_-]+\))?!?: .+'
          BAD=0

          echo "Checking commit subjects in $RANGE"
          echo ""
          while IFS= read -r subject; do
            if echo "$subject" | grep -qE "$PATTERN"; then
              echo "  ok    $subject"
            else
              echo "  warn  $subject"
              BAD=$((BAD + 1))
            fi
          done <<< "$SUBJECTS"

          echo ""
          if [ "$BAD" -gt 0 ]; then
            echo "::warning::$BAD commit message(s) do not follow Conventional Commits."
            echo ""
            echo "Format: <type>(<scope>): <description>"
            echo ""
            echo "  feat(radar): tambah filter urgensi di Squad Logs"
            echo "  fix(personel): perbaiki heading marker saat GPS hilang"
            echo "  ci: cache Rust build biar Android tidak 15 menit"
            echo ""
            echo "Types: feat fix docs style refactor perf test build ci chore revert"
            echo ""
            echo "This is advisory only and does NOT block the merge."
          else
            echo "All commit messages follow the convention."
          fi
