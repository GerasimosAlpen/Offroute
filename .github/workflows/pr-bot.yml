# The PR bot ("witch hunt" — same spirit, without the swearing).
#
# Two triggers, on purpose:
#
#  * pull_request_target — fires the greeting the moment a PR opens. Needed
#    because PRs here come from forks, and a plain `pull_request` trigger gets
#    a read-only token that cannot post a comment. This job NEVER checks out or
#    runs PR code; it only reads context values, which is what makes
#    pull_request_target safe to use here.
#
#  * workflow_run — fires after Build finishes and reports the result. Same
#    reason: the Build run itself has no write access on a fork PR.
#
# Both write to a single sticky comment instead of adding a new one per run.
# The old pipeline posted two fresh comments on every push, which buried long
# PRs in noise.
name: PR Bot

on:
  pull_request_target:
    types: [opened, reopened]
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  greet:
    name: Greeting
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- offroute-pr-bot -->';
            const body = [
              marker,
              '### Offroute CI is inspecting your changes',
              '',
              `**Opened by:** @${context.payload.pull_request.user.login}`,
              '',
              '**Expected timings.** Measured from real runs in this repo, not guessed.',
              'All jobs run in parallel, so the total is roughly the slowest one.',
              '',
              '| Job | Cold cache | Warm cache |',
              '| --- | --- | --- |',
              '| CI (typecheck, test, lint) | ~2 min | ~2 min |',
              '| Security | ~1 min | ~1 min |',
              '| macOS Apple Silicon | ~6 min | ~3 min |',
              '| Linux | ~8 min | ~4 min |',
              '| Windows | ~10 min | ~5 min |',
              '| macOS Intel | ~10 min | ~5 min |',
              '| Android | ~16 min | ~7 min |',
              '| **Total (parallel)** | **~16 min** | **~7 min** |',
              '',
              '"Cold cache" means the first run after `Cargo.toml`, `deno.lock`, or the',
              'toolchain changes. Otherwise the Rust/Gradle/Deno caches apply.',
              '',
              '> This comment updates itself when the build finishes — no new comments,',
              '> so the PR stays readable.',
              '> If something goes red, the full log is in the **Actions** tab.',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ---------------------------------------------------------------------------
  report:
    name: Build result report
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const marker = '<!-- offroute-pr-bot -->';

            // A workflow_run payload does not carry the PR number, so resolve it
            // from the head SHA.
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: run.head_sha,
            });
            const pr = prs.data.find((p) => p.state === 'open');
            if (!pr) {
              core.info('No open PR for this commit — nothing to report.');
              return;
            }

            // Per-job results, so the table says which platform broke rather
            // than just "build failed".
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id },
            );

            const icon = (c) => ({
              success: 'Passed',
              failure: 'Failed',
              cancelled: 'Cancelled',
              skipped: 'Skipped',
            }[c] ?? c ?? 'Unknown');

            const rows = jobs
              .filter((j) => j.name !== 'Build result report')
              .map((j) => `| ${j.name} | ${icon(j.conclusion)} |`)
              .join('\n');

            const failed = jobs.filter((j) => j.conclusion === 'failure');
            const ok = failed.length === 0;

            const body = [
              marker,
              ok
                ? '### All builds passed'
                : '### Some builds failed',
              '',
              `**Commit:** \`${run.head_sha.slice(0, 7)}\` by @${pr.user.login}`,
              '',
              '| Job | Status |',
              '| --- | --- |',
              rows,
              '',
              ok
                ? `Artifacts (APK, EXE, DEB, DMG) are on [this run's page](${run.html_url}) under **Artifacts**.`
                : `@${pr.user.login} — needs a look: ${failed.map((j) => `**${j.name}**`).join(', ')}.\n\n` +
                  `Open the [full log here](${run.html_url}) and find the first red line — that is usually the root cause.\n\n` +
                  `> Every build job is blocking, so anything red does need fixing before merge.`,
              '',
              '> You have got this.',
            ].join('\n');

            // Update the sticky comment if it exists, otherwise create it.
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
