# Publishes builds.
#
# Two modes:
#
#   push to main  -> rebuilds every platform and updates the rolling
#                    "latest" pre-release in place. Always-current installers
#                    without having to dig through the Actions tab.
#
#   push a v* tag -> a real, permanent, versioned release.
#                      git tag v0.2.0 && git push origin v0.2.0
#
# This workflow owns main. build.yml deliberately does NOT trigger on a push to
# main, so a merge builds each platform exactly once, not twice.
name: Release

# No paths-ignore here on purpose. Path filters behave inconsistently for tag
# pushes, and a release that silently does not happen is far worse than a build
# that was not strictly necessary.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Reuses build.yml exactly, so a released binary comes from the same code path
  # every PR exercises — no second, drifting build definition.
  build:
    name: Build all platforms
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Artifacts arrive one directory per platform; the release wants a flat
      # list of installers.
      - name: Flatten artifact tree
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \
               -o -name '*.msi' -o -name '*.dmg' -o -name '*.apk' \) \
            -exec cp {} release/ \;
          echo "Files to publish:"
          ls -lh release/
          if [ -z "$(ls -A release/)" ]; then
            echo "::error::No installers were produced — refusing to publish an empty release."
            exit 1
          fi

      # Decide which of the two modes we are in.
      - name: Determine release mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"; PRE=false; NAME="Offroute $TAG"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"; PRE=false; NAME="Offroute $TAG"
          else
            TAG="latest"; PRE=true; NAME="Latest build (main)"
          fi
          {
            echo "tag=$TAG"
            echo "prerelease=$PRE"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.mode.outputs.tag }}"
          {
            echo "changelog<<CHANGELOG_EOF"
            if [ "$TAG" = "latest" ]; then
              echo "### Latest changes on \`main\`"
              echo ""
              git log --pretty=format:'- %s (%an)' -15
            else
              PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
              if [ -n "$PREV" ]; then
                echo "### Changes since $PREV"
                echo ""
                git log --pretty=format:'- %s (%an)' "$PREV..$TAG"
              else
                echo "### First release"
                echo ""
                git log --pretty=format:'- %s (%an)' -20
              fi
            fi
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.mode.outputs.tag }}
          name: ${{ steps.mode.outputs.name }}
          prerelease: ${{ steps.mode.outputs.prerelease }}
          files: release/*
          # The rolling release is replaced wholesale each time, so stale
          # installers from the previous commit never linger.
          fail_on_unmatched_files: true
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ---

            ### Downloads

            | Platform | File |
            | --- | --- |
            | Windows | `.exe` (NSIS installer) or `.msi` |
            | macOS Apple Silicon | `.dmg` (aarch64) |
            | macOS Intel | `.dmg` (x86_64) |
            | Linux | `.deb` (Debian/Ubuntu) or `.AppImage` (portable) |
            | Android | `.apk` |

            > **Note.** The Android APK is signed with a *debug key* — fine for
            > testing, not for public distribution. macOS and Windows will warn
            > about an "unidentified developer" because there is no code signing
            > certificate yet.
            >
            > No iOS build: that requires a paid Apple Developer account.
