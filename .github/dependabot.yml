# Dependency updates for a three-person team.
#
# The first version of this file opened ~30 PRs in one go. Two mistakes caused it:
#
#   1. The groups had `update-types: [minor, patch]`. Grouping ONLY applies to
#      the listed types, so every MAJOR bump escaped the group and got its own
#      PR — typescript 5→7, vite 6→8, eslint 9→10, jsdom 26→30, and so on.
#   2. Weekly across four ecosystems, each with a limit of 5.
#
# Fixed by:
#   - Ignoring major bumps entirely. A major is a migration, not a chore: vite
#     6→8 or typescript 5→7 would break the build, and a red auto-PR nobody
#     asked for is pure noise. Do those deliberately, by hand, when you choose to.
#   - Grouping everything that is left into ONE PR per ecosystem.
#   - Monthly instead of weekly.
#
# Ceiling is now 4 PRs a month, all minor/patch, and they should be green.
version: 2

updates:
  # --- Frontend (npm deps, resolved through Deno) ------------------------------
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '02:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 1
    labels: ['area:deps', 'area:frontend']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      frontend:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Majors are handled by hand. See the note at the top of this file.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # --- Backend (NestJS) --------------------------------------------------------
  - package-ecosystem: npm
    directory: '/_server'
    schedule:
      interval: monthly
      day: monday
      time: '02:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 1
    labels: ['area:deps', 'area:backend']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      backend:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # --- Rust / Tauri ------------------------------------------------------------
  - package-ecosystem: cargo
    directory: '/src-tauri'
    schedule:
      interval: monthly
      day: monday
      time: '02:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 1
    labels: ['area:deps', 'area:rust']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      rust:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # --- GitHub Actions ----------------------------------------------------------
  # The pipeline is load-bearing for shipping desktop and mobile builds, so keep
  # the actions current. Action majors ARE allowed: they are small, self-contained
  # bumps (actions/checkout v4 -> v5), and a stale action eventually stops working
  # when GitHub retires a runner Node version.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '02:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 1
    labels: ['area:deps', 'area:ci']
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
