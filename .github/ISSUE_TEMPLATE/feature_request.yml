name: Feature request
description: A new feature or an improvement
title: 'feat: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem to solve
      description: Start from the problem, not the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: persona
    attributes:
      label: Who it is for
      options:
        - Citizens (affected public)
        - Field personnel (SAR / volunteers)
        - Operators (BPBD / command post, Ranger Command)
        - Everyone
        - Internal (developer / tooling)
    validations:
      required: true

  - type: dropdown
    id: requirement
    attributes:
      label: Related functional requirement (proposal, Table 2)
      options:
        - 'FR-01 — Compute the safest route to an evacuation point (WPMTRS)'
        - 'FR-02 — Update hazard weights from incident reports'
        - 'FR-03 — Report incidents with location and photo'
        - 'FR-04 — FLARE mode via BLE'
        - 'FR-05 — Tactical map, incident log, unit status'
        - 'FR-06 — Sync via UDP multicast'
        - 'FR-07 — Manage evacuation points and capacity'
        - 'FR-08 — Persist report logs and route history'
        - 'FR-09 — Download offline maps'
        - 'Not related to any FR (new idea)'

  - type: dropdown
    id: offline
    attributes:
      label: Must it work without internet?
      description: Offline-first is the main reason this app exists. Anything needing the cloud needs justification.
      options:
        - 'Yes — must work offline'
        - 'No — may require internet'
        - 'Partly — works offline with reduced capability'
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
