name: Bug report
description: Something is broken or behaving unexpectedly
title: 'fix: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The more detail, the faster the root cause turns up.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug. A screenshot or screen recording helps a lot.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - Citizen (/user)
        - Field personnel (/ranger/personel)
        - Ranger Command / radar (/ranger/radar)
        - SOS (/sos)
        - Backend (_server)
        - CI / build
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Where it ran
      description: Browser and Tauri behaviour genuinely differ — especially Bluetooth and GPS.
      options:
        - Tauri desktop (macOS)
        - Tauri desktop (Windows)
        - Tauri desktop (Linux)
        - Tauri Android (APK)
        - Desktop browser
        - Mobile browser
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors / logs
      description: Open DevTools, Console tab. Paste anything in red.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Already checked
      options:
        - label: The backend (`_server`) is running and reachable
        - label: Checked `TODO.md` — this feature is supposed to be real, not simulated
