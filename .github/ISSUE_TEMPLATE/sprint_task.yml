name: Tugas Sprint
description: Item kerja untuk sprint berjalan
title: 'task: '
labels: ['sprint-task']
body:
  - type: markdown
    attributes:
      value: |
        Untuk memecah pekerjaan sprint sesuai fase di proposal (Tabel 1).

  - type: textarea
    id: description
    attributes:
      label: Yang perlu dikerjakan
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Fase pengembangan
      options:
        - 'Fase 1 (Minggu 1-2) — PBF Parser (Rust)'
        - 'Fase 2 (Minggu 3-4) — Graph Builder + Dijkstra'
        - 'Fase 3 (Minggu 5-7) — Contraction Hierarchies + fungsi biaya'
        - 'Fase 4 (Minggu 8-9) — Query multi target, UDP sync, Lapor Insiden'
        - 'Fase 5 (Minggu 10-11) — Mode Flare, Comm Center, dashboard, uji eksternal'
        - 'Fase 6 (Minggu 12) — End to end testing, dokumentasi, demo'
        - 'Di luar fase (maintenance / bug / tooling)'
    validations:
      required: true

  - type: dropdown
    id: owner
    attributes:
      label: Penanggung jawab
      description: Sesuai pembagian di proposal Bagian VII.
      options:
        - 'Daffa — arsitektur, graph & routing engine'
        - 'Gerasimos — data parser, struktur graph, backend'
        - 'Adrian — front-end, sinkronisasi, dashboard'
        - 'Belum ditentukan'
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Kapan tugas ini boleh dianggap selesai?
      value: |
        - [ ] Implementasi selesai
        - [ ] `deno task typecheck` dan `deno task build` lolos
        - [ ] Sudah diuji manual
        - [ ] `TODO.md` diperbarui kalau ada yang masih simulasi
    validations:
      required: true

  - type: textarea
    id: blockers
    attributes:
      label: Blocker atau ketergantungan
