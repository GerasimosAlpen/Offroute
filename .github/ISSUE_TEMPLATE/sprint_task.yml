name: Sprint task
description: A work item for the current sprint
title: 'task: '
labels: ['sprint-task']
body:
  - type: markdown
    attributes:
      value: |
        For breaking sprint work down against the phases in the proposal (Table 1).

  - type: textarea
    id: description
    attributes:
      label: What needs doing
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Development phase
      options:
        - 'Phase 1 (Weeks 1-2) — PBF parser (Rust)'
        - 'Phase 2 (Weeks 3-4) — Graph builder + Dijkstra'
        - 'Phase 3 (Weeks 5-7) — Contraction Hierarchies + cost function'
        - 'Phase 4 (Weeks 8-9) — Multi-target query, UDP sync, incident reporting'
        - 'Phase 5 (Weeks 10-11) — FLARE mode, Comm Center, dashboard, external testing'
        - 'Phase 6 (Week 12) — End-to-end testing, documentation, demo'
        - 'Outside the phases (maintenance / bug / tooling)'
    validations:
      required: true

  - type: dropdown
    id: owner
    attributes:
      label: Owner
      description: Following the split in proposal section VII.
      options:
        - 'Daffa — architecture, graph and routing engine'
        - 'Gerasimos — data parser, graph structures, backend'
        - 'Adrian — front-end, synchronisation, dashboard'
        - 'Unassigned'
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: When is this task allowed to be called finished?
      value: |
        - [ ] Implementation complete
        - [ ] `deno task typecheck` and `deno task build` pass
        - [ ] Manually tested
        - [ ] `TODO.md` updated if anything remains simulated
    validations:
      required: true

  - type: textarea
    id: blockers
    attributes:
      label: Blockers or dependencies
